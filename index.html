<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050813" />
    <meta name="color-scheme" content="dark light" />
    <title>Tera Twin — Earth & Planetary Analog Explorer</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get("theme");
          var saved = window.localStorage.getItem("tera-twin-theme");
          var theme = urlTheme === "light" || urlTheme === "dark" ? urlTheme : saved === "light" || saved === "dark" ? saved : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <meta name="description" content="Compare Earth, Mars and the Moon, find geographical twins, and plan mission analog sites with Tera Twin." />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
